name: Docker Build and Push

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: ${{ github.repository }}

enable-openid-connect: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Authorized Integration JWT
        id: forgejo-jwt
        env:
          AUDIENCE_ID: "u:2:29cdf73a-aa50-4233-8250-457561480534"
        run: |
          jwt=$(curl --fail -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE_ID" \
            | jq -r ".value")

          echo "::add-mask::$jwt"
          echo "token=$jwt" >> $GITHUB_OUTPUT

      - name: Derive registry hostname
        id: registry
        run: |
          url="$GITHUB_SERVER_URL"
          host="${url#https://}"
          host="${host#http://}"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ steps.forgejo-jwt.outputs.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
